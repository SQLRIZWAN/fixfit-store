  <script>
    (function () {
      var HTTPS = 'https://fixandfit.store/';
      var HTTP = 'http://fixandfit.store/';
      var target = HTTPS;
      function go() { location.replace(target); }
      try {
        var img = new Image();
        var done = false;
        img.onload = function () { if (!done) { done = true; go(); } };
        img.onerror = function () {
          if (done) return;
          done = true;
          target = HTTP;
          go();
        };
        img.src = 'https://fixandfit.store/assets/shop-logo.webp';
        setTimeout(function () { if (!done) { done = true; go(); } }, 2000);
      } catch (e) { go(); }
    })();
  </script>
